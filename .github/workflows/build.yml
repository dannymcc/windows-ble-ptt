name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore windows-ble-ptt.sln

      - name: Build (Release)
        run: dotnet build windows-ble-ptt.sln -c Release --no-restore /p:ContinuousIntegrationBuild=true

      - name: Publish self-contained single-file (win-x64)
        run: dotnet publish src/WindowsBlePtt/WindowsBlePtt.csproj -c Release -r win-x64 --self-contained true -o publish /p:PublishSingleFile=true

      - name: Stage release asset
        id: stage
        shell: pwsh
        env:
          # GITHUB_REF_NAME is set by the runner and constrained to git ref characters; copy
          # it via env to satisfy the workflow-injection linter pattern.
          REF_NAME: ${{ github.ref_name }}
        run: |
          $ref = "$env:REF_NAME" -replace '/', '-'
          $exe = Get-ChildItem -Path publish -Filter 'WindowsBlePtt.exe' | Select-Object -First 1
          if (-not $exe) { throw 'WindowsBlePtt.exe not found in publish output' }
          $dest = "artifacts/windows-ble-ptt-$ref.exe"
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item $exe.FullName $dest
          "asset_path=$dest" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "asset_name=$(Split-Path -Leaf $dest)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.stage.outputs.asset_name }}
          path: ${{ steps.stage.outputs.asset_path }}
          if-no-files-found: error

      - name: Publish rolling pre-release (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-main
          name: Latest build (main)
          body: |
            Rolling build from the latest commit on `main`. Self-contained single-file Windows
            x64 executable; no .NET install required, just run it.
          prerelease: true
          files: ${{ steps.stage.outputs.asset_path }}

      - name: Publish tagged release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ${{ steps.stage.outputs.asset_path }}
